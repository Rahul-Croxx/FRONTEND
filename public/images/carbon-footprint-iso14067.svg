<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Product Carbon Footprint – ISO 14067:2018</title>
  <desc id="d">Badge: CroxX product carbon footprint calculated and verified according to ISO 14067:2018</desc>
  <defs>
    <path id="topArc" d="M 50 160 A 110 110 0 0 1 270 160"/>
    <path id="bottomArc" d="M 40 160 A 120 120 0 0 0 280 160"/>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f9a4f"/>
      <stop offset="1" stop-color="#27763a"/>
    </linearGradient>
  </defs>

  <!-- outer rings -->
  <circle cx="160" cy="160" r="156" fill="#ffffff"/>
  <circle cx="160" cy="160" r="150" fill="none" stroke="#dd6f15" stroke-width="8"/>
  <circle cx="160" cy="160" r="138" fill="none" stroke="#dd6f15" stroke-width="1.5" stroke-dasharray="2 5"/>

  <!-- curved texts -->
  <text font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2.2" fill="#dd6f15">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">PRODUCT CARBON FOOTPRINT</textPath>
  </text>
  <text font-family="Roboto, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#27763a">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle" dominant-baseline="hanging">CALCULATED &amp; VERIFIED</textPath>
  </text>

  <!-- inner disc -->
  <circle cx="160" cy="160" r="98" fill="url(#g)"/>

  <!-- leaf -->
  <g transform="translate(160 112)">
    <path d="M -22 18 C -24 -8 -2 -24 26 -22 C 28 6 8 24 -18 20 Z" fill="#ffffff"/>
    <path d="M -18 18 C -6 6 6 -6 20 -18" fill="none" stroke="#27763a" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- CO2e -->
  <text x="160" y="178" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff">CO<tspan font-size="26" dy="10">2</tspan><tspan font-size="30" dy="-10">e</tspan></text>

  <!-- ISO ribbon -->
  <rect x="86" y="194" width="148" height="34" rx="17" fill="#dd6f15"/>
  <text x="160" y="217" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" letter-spacing="0.5">ISO 14067:2018</text>
</svg>
